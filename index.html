<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Academy OS</title>
<style>
:root{--navy:#0B2A6B;--blue:#2F80ED;--bg:#EEF2F8;--card:#fff;--line:#D9DFEB;--act:#E8F0FE;--h:#0B2A6B;--tx:#1a1f2e;--mut:#6b7385;--g:#2E9E4F;--o:#F5A623;--r:#D9342B}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(84px + env(safe-area-inset-bottom,0px))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#182036;--line:#2b3554;--tx:#e8ecf7;--mut:#9aa4bd;--h:#8fb8ff;--act:#22345f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#182036;--line:#2b3554;--tx:#e8ecf7;--mut:#9aa4bd;--h:#8fb8ff;--act:#22345f;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
.wrap{max-width:1100px;margin:auto;background:var(--card);border-radius:14px;box-shadow:0 6px 24px #0b2a6b22;overflow:hidden}
header{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;letter-spacing:1px}header h1 b{color:#6FB1FF}
header button{background:var(--card)fff22;color:#fff;border:0;padding:7px 12px;border-radius:8px;cursor:pointer}
main{padding:18px 22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;gap:12px;margin-bottom:18px}
.k{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px}
.k small{font-weight:700;font-size:11px;color:var(--c)}.k div{font-size:22px;font-weight:700;margin-top:6px}.k span{font-size:11px;color:var(--mut)}
.chart{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chart small{font-weight:700;font-size:11px;color:var(--h);width:100%}
.dn{width:84px;height:84px;border-radius:50%;position:relative;flex:none}.dn:after{content:"";position:absolute;inset:22px;background:var(--card);border-radius:50%}
.lg{font-size:12px;line-height:1.8}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy);color:#fff;padding:11px 8px;text-align:center;font-size:12px}th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:center}td.l{text-align:left}
.pill{display:inline-block;padding:5px 14px;border-radius:5px;font-weight:700;font-size:12px}
.PAID{background:#C6EFCE;color:#1E7B34}.DUE{background:#FFEB9C;color:#9C6500}.OVERDUE{background:#FFC7CE;color:#9C0006}.INACTIVE{background:#e3e3e3;color:#666}
.wa{display:inline-flex;width:34px;height:34px;border-radius:50%;background:#25D366;color:#fff;align-items:center;justify-content:center;text-decoration:none;font-size:18px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}.btn.s{padding:5px 9px;font-size:12px}.btn.d{background:var(--r)}.btn.g{background:var(--g)}
.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap}.bar h2{margin:0;font-size:18px;color:var(--h)}
input,select,textarea{color:var(--tx);width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card)}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);overflow-x:auto}
nav a{flex:1;min-width:88px;text-align:center;padding:12px 6px;font-size:13px;color:var(--tx);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:var(--blue);font-weight:700;border-color:var(--blue);background:var(--act)}
.note{color:var(--mut);font-size:12px;margin-top:10px}
.at button{color:var(--tx);width:40px;height:34px;margin-left:4px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-weight:700}
.at .P.on,.at .A.on,.at .L.on{color:#1a1f2e}.at .P.on{background:#C6EFCE}.at .A.on{background:#FFC7CE}.at .L.on{background:#FFEB9C}
.chip{display:inline-block;white-space:nowrap;background:var(--bg);padding:7px 12px;border-radius:20px;font-size:12px;margin:0 6px 8px 0;max-width:100%}
.md{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md form{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.md label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px;color:var(--h)}
.login{max-width:380px;margin:12vh auto;background:var(--card);border-radius:14px;padding:26px;box-shadow:0 6px 24px #0b2a6b22}
.lg{display:block;max-width:130px;max-height:130px;margin:0 auto 12px;object-fit:contain;border-radius:12px}header img.hd{height:40px;width:auto;border-radius:8px;background:#fff;padding:2px}.login{position:relative}.thm{position:absolute;top:10px;right:12px;background:none;border:0;font-size:22px;cursor:pointer}.login h1{color:var(--h);text-align:center;margin:0 0 18px}.login h1 b{color:var(--blue)}.login input{margin-bottom:10px}
.err{color:var(--r);font-size:13px}
.mxw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.mxw table{display:table!important;min-width:max-content}.mxw thead{display:table-header-group!important}.mxw tbody{display:table-row-group!important}
.mxw tr{display:table-row!important;border:0!important;margin:0!important;padding:0!important}
.mxw td,.mxw th{display:table-cell!important;text-align:center!important;padding:8px 5px!important;font-size:12px}
.mxw td:before{content:none!important}.mxw td.l{text-align:left!important;min-width:140px;white-space:nowrap}
.mxw td:first-child,.mxw th:first-child{position:sticky;left:0;z-index:1;background:var(--card)}.mxw th:first-child{background:var(--navy);z-index:2}
.cP{background:#C6EFCE;color:#1E7B34;font-weight:700}.cA{background:#FFC7CE;color:#9C0006;font-weight:700}.cL{background:#FFEB9C;color:#9C6500;font-weight:700}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.chart{grid-column:1/-1}}
@media(max-width:720px){
 main{padding:14px}header{padding:14px}header h1{font-size:20px}
 nav{position:fixed;bottom:0;left:0;right:0;z-index:5;box-shadow:0 -3px 12px #0002}nav a{font-size:11px;min-width:70px}nav a span{display:block;font-size:18px}
 table,thead,tbody,tr,td{display:block}thead{display:none}
 tr{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:6px}
 td{display:flex;justify-content:space-between;align-items:center;border:0;padding:6px 8px;text-align:right}td.l{text-align:right}
 td:before{content:attr(data-l);font-weight:700;color:var(--mut);font-size:12px;text-align:left}}
@media(min-width:721px){nav a span{margin-right:5px}}
</style></head><body>
<div id="app"></div>
<script>
/* ===== STORAGE LAYER (localStorage). Same API shape as Firestore: swap this block for firebase.firestore() later. ===== */
const store={};try{Object.assign(store,JSON.parse(localStorage.getItem('academyos')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('academyos',JSON.stringify(store))}catch(e){}};
const col=c=>store[c]||(store[c]={});
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const db={collection:c=>({add:async v=>{const id=uid();col(c)[id]=v;commit();return{id}},
 doc:id=>({update:async v=>{Object.assign(col(c)[id]||(col(c)[id]={}),v);commit()},set:async v=>{col(c)[id]=v;commit()},delete:async()=>{delete col(c)[id];commit()}})})};
const $=s=>document.querySelector(s);
function commit(){persist();load();render();fsQueue()}
function load(){['students','payments','attendance','expenses'].forEach(c=>{S[c]=Object.entries(col(c)).map(([id,v])=>({id,...v}))});
 S.students.sort((a,b)=>(a.code||'').localeCompare(b.code||''));S.students.forEach(x=>{if(x.active==='Y')x.active='Yes';if(x.active==='N')x.active='No'});Object.assign(S.set,col('settings').main||{})}
const cred=()=>store.auth||{u:'admin',p:'admin123'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=d=>{if(!d)return'-';const[a,b,c]=d.split('-');return c+'-'+MON[b-1]+'-'+a};
const n0=n=>Math.round(n).toLocaleString('en-US'),rs=n=>'Rs. '+n0(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={students:[],payments:[],attendance:[],expenses:[],set:{academy:'Academy OS',dueDay:10,cc:'92',partial:'No',
 msg:'Dear {name}, your fee of Rs. {balance} for {class} is pending. Due date: {due}. Kindly pay soon. Thank you - {academy}',
 thanks:'Dear {name}, we received your fee for {month}. Thank you! - {academy}'},view:'dashboard',month:today().slice(0,7),adate:today(),q:''};
const NAV=[['dashboard','📊','Dashboard'],['students','👥','Students'],['fees','💰','Fees'],['attendance','✅','Attendance'],['expenses','👜','Expenses'],['reminders','🔔','Reminders'],['settings','⚙️','Settings']];

/* ---------- calculations ---------- */
function calc(s){
 const m=S.month,ps=S.payments.filter(p=>p.sid===s.id),paid=ps.filter(p=>(p.date||'').startsWith(m)).reduce((a,p)=>a+ +p.amount,0);
 const fee=+s.fee||0,bal=s.active==='No'?0:Math.max(0,fee-paid),due=m+'-'+pad(+S.set.dueDay||10);
 let st='DUE';if(s.active==='No')st='INACTIVE';else if(bal<=0)st='PAID';else if(today()>due&&(paid===0||S.set.partial==='Yes'))st='OVERDUE';
 const last=ps.map(p=>p.date).sort().pop()||'';
 let[y,mo]=m.split('-').map(Number);mo++;if(mo>12){mo=1;y++}
 return{...s,paid,bal,fee,st,last,due,next:st==='PAID'?y+'-'+pad(mo)+'-'+pad(+S.set.dueDay||10):due};
}
const rows=()=>S.students.map(calc);
function waLink(r){
 let p=String(r.phone||'').replace(/\D/g,'');if(!p)return'';if(p[0]==='0')p=S.set.cc+p.slice(1);
 const t=(r.st==='PAID'?S.set.thanks:S.set.msg).replace(/{name}/g,r.name).replace(/{class}|{course}/g,r.course||'').replace(/{balance}/g,n0(r.bal))
  .replace(/{due}/g,fd(r.next)).replace(/{month}/g,S.month).replace(/{academy}/g,S.set.academy);
 return'https://wa.me/'+p+'?text='+encodeURIComponent(t);
}
const wa=r=>{const l=waLink(r);return l?`<a class="wa" target="_blank" rel="noopener" href="${l}" title="WhatsApp">💬</a>`:'-'};

/* ---------- views ---------- */
function table(list,pay){
 if(!list.length)return'<p class="note">No students yet. Add some in the Students tab.</p>';
 return`<table><thead><tr><th>ID</th><th>Student Name</th><th>Class</th><th>Monthly Fee</th><th>Total Paid</th><th>Balance</th><th>Status</th><th>Last Payment</th><th>Next Due Date</th><th>WhatsApp</th>${pay?'<th>Pay</th>':''}</tr></thead><tbody>`+
 list.map(r=>`<tr><td data-l="ID">${esc(r.code)}</td><td data-l="Student" class="l">${esc(r.name)}</td><td data-l="Class" class="l">${esc(r.course)}</td><td data-l="Monthly Fee">${n0(r.fee)}</td><td data-l="Total Paid">${n0(r.paid)}</td><td data-l="Balance">${n0(r.bal)}</td><td data-l="Status"><span class="pill ${r.st}">${r.st}</span></td><td data-l="Last Payment">${fd(r.last)}</td><td data-l="Next Due">${r.st==='INACTIVE'?'-':fd(r.next)}</td><td data-l="WhatsApp">${wa(r)}</td>${pay?`<td data-l="Pay"><button class="btn s g" onclick="payForm('${r.id}')">+ Pay</button></td>`:''}</tr>`).join('')+'</tbody></table>';
}
function monthBar(t,extra=''){return`<div class="bar"><h2>${t}</h2><div><input type="month" value="${S.month}" style="width:auto" onchange="S.month=this.value;render()"> ${extra}</div></div>`}
const V={
dashboard(){
 const r=rows().filter(x=>x.st!=='INACTIVE'),tf=r.reduce((a,x)=>a+x.fee,0),tp=r.reduce((a,x)=>a+x.paid,0),td=r.reduce((a,x)=>a+x.bal,0);
 const dueA=r.filter(x=>x.st==='DUE').reduce((a,x)=>a+x.bal,0),ovA=r.filter(x=>x.st==='OVERDUE').reduce((a,x)=>a+x.bal,0);
 const pd=tf?Math.round(dueA/tf*100):0,po=tf?Math.round(ovA/tf*100):0,pp=tf?100-pd-po:0;
 return monthBar('Dashboard')+fsBanner()+backupBanner()+`<div class="kpis">
 <div class="k" style="--c:#1E9E4A"><small>👥 TOTAL STUDENTS</small><div>${r.length}</div><span>Active students</span></div>
 <div class="k" style="--c:#2F5FE0"><small>₹ TOTAL FEES</small><div>${rs(tf)}</div><span>Billing ${S.month}</span></div>
 <div class="k" style="--c:#1E9E4A"><small>✔ TOTAL PAID</small><div>${rs(tp)}</div><span>${pp}% settled</span></div>
 <div class="k" style="--c:#D9342B"><small>❗ TOTAL DUE</small><div>${rs(td)}</div><span>${pd+po}% outstanding</span></div>
 <div class="chart"><small>FEE STATUS OVERVIEW</small><div class="dn" style="background:${tf?`conic-gradient(#2E9E4F 0 ${pp}%,#F5A623 ${pp}% ${pp+pd}%,#D9342B ${pp+pd}% 100%)`:'#ddd'}"></div>
 <div class="lg"><i style="background:#2E9E4F"></i>Paid ${pp}%<br><i style="background:#F5A623"></i>Due ${pd}%<br><i style="background:#D9342B"></i>Overdue ${po}%</div></div></div>`+table(r.concat(rows().filter(x=>x.st==='INACTIVE')));
},
students(){
 const q=S.q.toLowerCase(),l=rows().filter(x=>(x.name+x.course+x.code).toLowerCase().includes(q));
 return`<div class="bar"><h2>Students</h2><div style="display:flex;gap:8px"><input id="q" placeholder="Search…" value="${esc(S.q)}" oninput="S.q=this.value;render();const i=$('#q');i.focus();i.setSelectionRange(99,99)"><button class="btn" onclick="studentForm()">+ Add</button></div></div>`+
 (l.length?`<table><thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Phone</th><th>Fee</th><th>Active</th><th>Actions</th></tr></thead><tbody>`+
 l.map(x=>`<tr><td data-l="ID">${esc(x.code)}</td><td data-l="Name" class="l">${esc(x.name)}</td><td data-l="Class" class="l">${esc(x.course)}</td><td data-l="Phone">${esc(x.phone)}</td><td data-l="Fee">${n0(x.fee)}</td><td data-l="Active">${x.active||'Yes'}</td><td data-l="Actions"><button class="btn s" onclick="studentForm('${x.id}')">Edit</button> <button class="btn s d" onclick="delDoc('students','${x.id}')">Delete</button></td></tr>`).join('')+'</tbody></table>':'<p class="note">No students found.</p>');
},
fees(){
 const pl=S.payments.filter(p=>(p.date||'').startsWith(S.month)).sort((a,b)=>b.date.localeCompare(a.date));
 return monthBar('Fees')+table(rows(),true)+`<h3 style="color:var(--h)">Payments this month — ${rs(pl.reduce((a,p)=>a+ +p.amount,0))}</h3>`+
 (pl.length?`<table><thead><tr><th>Date</th><th>Student</th><th>Amount</th><th>Method</th><th></th></tr></thead><tbody>`+pl.map(p=>{const s=S.students.find(x=>x.id===p.sid)||{};return`<tr><td data-l="Date">${fd(p.date)}</td><td data-l="Student" class="l">${esc(s.name||'?')}</td><td data-l="Amount">${n0(p.amount)}</td><td data-l="Method">${esc(p.method)}</td><td><button class="btn s d" onclick="delDoc('payments','${p.id}')">✕</button></td></tr>`}).join('')+'</tbody></table>':'<p class="note">No payments recorded for this month.</p>');
},
attendance(){
 const m=S.adate.slice(0,7),l=S.students.filter(s=>s.active!=='No'),saved={};
 S.attendance.filter(a=>a.date===S.adate).forEach(a=>saved[a.sid]=a.status);
 if(!S.draft)S.draft={...saved};
 const dirty=l.some(s=>(S.draft[s.id]||'')!==(saved[s.id]||'')),c=k=>l.filter(s=>S.draft[s.id]===k).length;
 const days=[...new Set(S.attendance.filter(a=>a.date.startsWith(m)).map(a=>a.date))].sort();
 const rep=l.map(s=>{const r=S.attendance.filter(a=>a.sid===s.id&&a.date.startsWith(m)),n=k=>r.filter(a=>a.status===k).length,p=n('P'),ab=n('A'),lt=n('L'),t=p+ab+lt;return{...s,p,ab,lt,pc:t?Math.round((p+lt)/t*100):'-'}});
 return`<div class="bar"><h2>Attendance</h2><input type="date" value="${S.adate}" style="width:auto" onchange="S.adate=this.value;S.draft=null;render()"></div>
 <p><span class="chip">✅ Present ${c('P')}</span><span class="chip">❌ Absent ${c('A')}</span><span class="chip">🏖 Leave ${c('L')}</span>
 <b style="font-size:12px;color:${dirty?'#D9342B':'#2E9E4F'}">${dirty?'● Unsaved changes':(Object.keys(saved).length?'✓ Saved':'Not marked yet')}</b></p>
 <p><button class="btn g" onclick="saveAtt()">💾 Save Attendance</button> <button class="btn" onclick="allP()">Mark all present</button></p>`+
 (l.length?`<table class="at"><thead><tr><th>ID</th><th>Student</th><th>Class</th><th>Mark</th></tr></thead><tbody>`+l.map(s=>`<tr><td data-l="ID">${esc(s.code)}</td><td data-l="Student" class="l">${esc(s.name)}</td><td data-l="Class" class="l">${esc(s.course)}</td><td data-l="Mark">${['P','A','L'].map(k=>`<button class="${k} ${S.draft[s.id]===k?'on':''}" onclick="setMark('${s.id}','${k}')">${k}</button>`).join('')}</td></tr>`).join('')+'</tbody></table>':'<p class="note">Add students first.</p>')+
 `<h3 style="color:var(--h);margin-top:26px">Attendance report — ${m}</h3><p class="note" style="margin:0 0 8px">P present · A absent · L leave. % = present days out of marked days. Marks you tap above show here instantly (press Save to keep them). Tap a date number to open that day. Scroll sideways for all dates.</p>`+matrix(l,m);
},
expenses(){
 const l=S.expenses.filter(e=>(e.date||'').startsWith(S.month)).sort((a,b)=>b.date.localeCompare(a.date)),ex=l.reduce((a,e)=>a+ +e.amount,0),col=S.payments.filter(p=>(p.date||'').startsWith(S.month)).reduce((a,p)=>a+ +p.amount,0);
 return monthBar('Expenses','<button class="btn" onclick="expForm()">+ Add</button>')+`<p><span class="chip">Collected ${rs(col)}</span><span class="chip">Expenses ${rs(ex)}</span><span class="chip"><b>Net ${rs(col-ex)}</b></span></p>`+
 (l.length?`<table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr></thead><tbody>`+l.map(e=>`<tr><td data-l="Date">${fd(e.date)}</td><td data-l="Category">${esc(e.cat)}</td><td data-l="Description" class="l">${esc(e.desc)}</td><td data-l="Amount">${n0(e.amount)}</td><td><button class="btn s d" onclick="delDoc('expenses','${e.id}')">✕</button></td></tr>`).join('')+'</tbody></table>':'<p class="note">No expenses this month.</p>');
},
reminders(){
 const l=rows().filter(r=>r.st==='DUE'||r.st==='OVERDUE');
 return monthBar('Reminders')+`<p><span class="chip">Pending ${l.length}</span><span class="chip">Outstanding ${rs(l.reduce((a,r)=>a+r.bal,0))}</span></p><p class="note" style="margin-top:0">Tap the green button to open WhatsApp with the message ready. No API needed.</p>`+(l.length?table(l):'<p class="note">🎉 Everyone has paid.</p>');
},
settings(){
 const s=S.set;return`<div class="bar"><h2>Settings</h2></div><form onsubmit="saveSet(event)" style="max-width:520px">
 <label>Academy name</label><input name="academy" value="${esc(s.academy)}">
 <label>Fee due day of month (1-28)</label><input name="dueDay" type="number" min="1" max="28" value="${s.dueDay}">
 <label>Partial payment becomes OVERDUE after due date?</label><select name="partial"><option ${s.partial==='No'?'selected':''}>No</option><option ${s.partial==='Yes'?'selected':''}>Yes</option></select>
 <label>Country code for WhatsApp (no +)</label><input name="cc" value="${esc(s.cc)}">
 <label>Reminder message</label><textarea name="msg" rows="3">${esc(s.msg)}</textarea>
 <label>Thank-you message</label><textarea name="thanks" rows="2">${esc(s.thanks)}</textarea>
 <p class="note">Placeholders: {name} {class} {balance} {due} {month} {academy}</p><button class="btn">Save settings</button></form>
 <h3 style="color:var(--h);margin-top:26px">Appearance</h3><select onchange="setTheme(this.value)" style="max-width:260px"><option value="" ${!store.theme?'selected':''}>Auto (follow device)</option><option value="light" ${store.theme==='light'?'selected':''}>☀️ Light mode</option><option value="dark" ${store.theme==='dark'?'selected':''}>🌙 Dark mode</option></select>

const canFS=()=>typeof window.showSaveFilePicker==='function';

async function fsInit(){if(!canFS())return;try{fh=await idb('get')||null;if(fh){fhOK=(await fh.queryPermission({mode:'readwrite'}))==='granted';if(fhOK)fsWrite();render()}}catch(e){}}

 try{await idb('put',fh)}catch(e){}fhOK=true;await fsWrite();render();toast('Excel file linked')}catch(e){fh=null;if(e.name!=='AbortError')toast('Could not link file: '+e.message)}}

async function unlinkExcel(){fh=null;fhOK=false;try{await idb('del')}catch(e){}render();toast('Excel link removed')}

const fsQueue=()=>{if(fh&&fhOK){clearTimeout(fhTimer);fhTimer=setTimeout(fsWrite,1200)}};

function upLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);store.logo=c.toDataURL('image/png');persist();render();toast('Logo saved')};im.onerror=()=>toast('Could not read this image');im.src=r.result};r.readAsDataURL(f)}
const rmLogo=()=>{delete store.logo;persist();render();toast('Logo removed')};
function seed(){const m=today().slice(0,7);
 [['001','Ali Raza','Class 6','03001234567',5000],['002','Sara Khan','Class 7','03111234567',4000],['003','Ahmed Ali','Class 8','03211234567',6000],['004','Hina Fatima','Class 9','03331234567',5000],['005','Usman Tariq','Class 10','03451234567',4500]]
 .forEach((r,i)=>{(store.students=store.students||{})['s'+i]={code:r[0],name:r[1],course:r[2],phone:r[3],fee:r[4],active:'Yes',created:i}});
 store.payments={};[[0,5000,'01'],[1,2000,'03'],[3,5000,'02'],[4,1000,'04']].forEach((p,i)=>store.payments['p'+i]={sid:'s'+p[0],amount:p[1],date:m+'-'+p[2],method:'Cash'});
 store.expenses={e0:{date:m+'-01',cat:'Rent',desc:'Building rent',amount:30000},e1:{date:m+'-05',cat:'Utilities',desc:'Electricity bill',amount:6500}};
 store.attendance={};store.settings={};persist()}
const resetDemo=()=>ask('Reset everything to demo data?',()=>{store.students={};seed();commit()});
const clearAll=()=>ask('Delete ALL students, payments, attendance and expenses?',()=>{['students','payments','attendance','expenses','settings'].forEach(c=>store[c]={});commit()});
function savePw(e){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));store.auth={u:v.u,p:v.p};persist();toast('Login updated')}
/* ---------- local admin login ---------- */
function loginView(msg=''){
 $('#app').innerHTML=`<form class="login" onsubmit="doLogin(event)"><button type="button" class="thm" onclick="toggleTheme()" title="Light / dark mode">${isDark()?'☀️':'🌙'}</button>${logoImg('lg')}<h1>${brandName()}</h1><input name="e" placeholder="Username" autocomplete="username" required><input name="p" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn" style="width:100%">Sign in</button><p class="err">${msg}</p><p class="note" style="text-align:center">Demo login: <b>admin</b> / <b>admin123</b></p></form>`;
}
function doLogin(e){e.preventDefault();const c=cred();
 if(e.target.e.value===c.u&&e.target.p.value===c.p){S.logged=1;try{sessionStorage.setItem('aos','1')}catch(x){}render()}else loginView('Wrong username or password')}
function logout(){S.logged=0;try{sessionStorage.removeItem('aos')}catch(x){}loginView()}
if(!store.students)seed();load();applyTheme();fsInit();
try{S.logged=sessionStorage.getItem('aos')==='1'}catch(e){}
S.logged?render():loginView();
</script></body></html>
